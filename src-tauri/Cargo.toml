[package]
name = "docker-pull-tar"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
build = "build.rs"

[lib]
name = "docker_pull_tar_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
test-utils = []

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
flate2 = "1"
httpdate = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tauri = { version = "=2.7.0", features = [] }
tauri-plugin-dialog = "=2.2.2"
tauri-plugin-opener = "=2.2.6"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-util = "0.7"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
wiremock = "=0.6.4"

[build-dependencies]
tauri-build = "=2.3.1"

[profile.release]
panic = "unwind"
strip = true
lto = true
codegen-units = 1
opt-level = "s"
